# dsh-zh-thinking 的 bundle 补丁层。
#
# 当 profile 的 package.json 把 dsh-zh-thinking 列进 dsh.profile.bundles
# （即 `dsh plugin --profile <name> add dsh-zh-thinking`）时自动挂载；
# loader 从 profile 的 node_modules 解析 `name`。
#
# `insert` 不带 `id` 的语义是「往补丁列表里追加一条新 entry」，
# 不会覆盖或删除 profile 里已有的任何行。
- insert:
    - id: zh-thinking
      name: dsh-zh-thinking
      # 需要自定义时打开下面几行（全部可省略）：
      # config:
      #   sectionName: zh:reasoning-language
      #   order: 1
      #   text: |-
      #     这里写你自己的语言要求正文。注意不要包含 {{ ，否则会被当成提示变量。
